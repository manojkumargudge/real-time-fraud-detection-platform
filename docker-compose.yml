# Local development stack: single-node Kafka (KRaft, no ZooKeeper), PostgreSQL, API, consumer.
# Prerequisites: `python -m src.models.train` (creates artifacts/baseline) and a .env file
# with POSTGRES_PASSWORD (see .env.example). Not a hardened production deployment.
#
# Lifecycle: Compose here otherwise creates containers with StopTimeout=1, so every service
# sets stop_grace_period explicitly. `unless-stopped` restarts after a crash or a Docker
# restart but respects an intentional `docker compose stop`.
name: fraud-platform

x-app-env: &app-env
  MODEL_DIR: /app/artifacts/baseline
  DATABASE_URL: postgresql://fraud:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/fraud
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  KAFKA_TOPIC: transactions
  KAFKA_GROUP_ID: fraud-scorer

services:
  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      # Without this the broker writes to /tmp/kafka-logs inside the container layer, so
      # recreating the container discards every topic and committed consumer offset.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    # Controlled shutdown flushes and closes all partition logs; a kill forces log recovery.
    stop_grace_period: 60s
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  postgres:
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: fraud
      POSTGRES_DB: fraud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The image stops with SIGINT (fast shutdown: roll back sessions, final checkpoint);
    # the checkpoint needs time to flush dirty buffers, a kill forces crash recovery.
    stop_grace_period: 60s
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    environment: *app-env
    volumes:
      - ./artifacts/baseline:/app/artifacts/baseline:ro
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Stateless: uvicorn and the store close in about 1 s.
    stop_grace_period: 10s
    # If PostgreSQL is still unavailable the API exits at startup and is retried with
    # Docker's growing back-off until it is.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  consumer:
    build: .
    command: ["python", "-m", "src.streaming.consumer"]
    environment: *app-env
    volumes:
      - ./artifacts/baseline:/app/artifacts/baseline:ro
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # SIGTERM finishes and commits the in-flight message, then leaves the consumer group.
    stop_grace_period: 30s
    # Not on-failure: a graceful SIGTERM exits 0, so on-failure would leave the consumer down
    # after a Docker restart while Kafka, PostgreSQL and the API come back.
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
