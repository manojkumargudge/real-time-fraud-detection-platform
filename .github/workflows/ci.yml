# CI: lint, type-check and unit tests, then integration tests against throwaway PostgreSQL,
# Kafka and Redis service containers, plus security scans. CD (push to main only, after all three
# pass): build the serving and dashboard images
# from the Dockerfile and push them to GitHub Container Registry. Nothing is deployed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy (strict, pyproject.toml)
        run: python -m mypy

      # The IEEE-CIS CSVs are not in git, so the real-data tests skip here (-rs lists them).
      - name: Unit tests
        run: python -m pytest --ignore=tests/test_integration.py -rfEs

  integration:
    name: integration tests (PostgreSQL + Kafka + Redis)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          # Test-only credentials for this throwaway container; not a secret.
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: fraud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraud -d fraud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      kafka:
        image: apache/kafka:3.8.1
        env:
          # Single-node KRaft broker, reachable from the runner at localhost:9092.
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_NUM_PARTITIONS: "3"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 20s
      redis:
        image: redis:7.4.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://fraud:ci-test-only@localhost:5432/fraud
      TEST_KAFKA_BOOTSTRAP: localhost:9092
      TEST_REDIS: localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Integration tests
        run: python -m pytest tests/test_integration.py -rfEs

  # Security gate: fails on any HIGH/CRITICAL finding that has a fix, except the accepted
  # risks listed (with reason and expiry) in security/pip-audit-ignore.txt and .trivyignore.
  security:
    name: security scans (pip-audit, bandit, Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanners
        run: python -m pip install pip-audit==2.10.1 bandit==1.9.4

      - name: pip-audit (all requirements files)
        run: |
          flags=$(python security/check_ignores.py pip-audit-flags security/pip-audit-ignore.txt)
          for f in requirements.txt requirements-serving.txt requirements-monitoring.txt requirements-dashboard.txt requirements-dev.txt requirements-gnn.txt; do
            echo "::group::pip-audit $f"
            pip-audit -r "$f" $flags --progress-spinner off
            echo "::endgroup::"
          done
          # The +cpu torch wheels are not on PyPI, so pip-audit skips them above; audit the
          # PyPI-equivalent versions instead. pyg-lib is not on PyPI and cannot be audited.
          python security/check_ignores.py gnn-equivalents requirements-gnn.txt > gnn-equivalents.txt
          pip-audit -r gnn-equivalents.txt --no-deps $flags --progress-spinner off

      - name: bandit (src/, medium severity and above)
        run: bandit -r src -ll -q

      - name: Build serving and dashboard images for scanning
        run: |
          docker build -t fraud-serving:scan .
          docker build -t fraud-dashboard:scan --build-arg REQUIREMENTS=requirements-dashboard.txt .

      - name: Trivy (serving image, HIGH/CRITICAL with a fix available)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy:0.75.0 image \
            --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /.trivyignore \
            --exit-code 1 fraud-serving:scan

      - name: Trivy (dashboard image, HIGH/CRITICAL with a fix available)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy:0.75.0 image \
            --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /.trivyignore \
            --exit-code 1 fraud-dashboard:scan

  image:
    name: build and push image (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, integration, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/manojkumargudge/real-time-fraud-detection-platform:${{ github.sha }}
            ghcr.io/manojkumargudge/real-time-fraud-detection-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Analyst dashboard image: the same Dockerfile with the Streamlit requirements.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: REQUIREMENTS=requirements-dashboard.txt
          tags: |
            ghcr.io/manojkumargudge/real-time-fraud-detection-platform-dashboard:${{ github.sha }}
            ghcr.io/manojkumargudge/real-time-fraud-detection-platform-dashboard:latest
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
