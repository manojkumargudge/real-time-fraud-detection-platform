name: Feast security candidate
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/feast-upgrade-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://fraud:test-only@127.0.0.1:25432/fraud
      TEST_REDIS: 127.0.0.1:26379
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Resolve a patched Feast trial environment only
        run: |
          sed -i -e 's/^numpy==1\.26\.4$/numpy==2.2.6/' \
            -e 's/^feast\[redis\]==0\.47\.0$/feast[redis]==0.67.0/' requirements.txt
          python -m pip install -r requirements-dev.txt pyarrow==23.0.1
          python -m pip check
      - run: docker compose -p feast-security-test -f docker-compose.test.yml up -d --wait postgres redis
      - name: Validate embedded SDK, scoring and partial-write recovery
        run: |
          python -m pytest tests/test_feast_store.py tests/test_feast_training.py tests/test_serving.py -rfEs
          python -m pytest tests/test_integration.py -k 'feast or journal or concurrent' -rfEs
