name: Release image inventory
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-images.yml
      - deploy/scan-release-image.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image: [serving, dashboard, kafka, postgres, redis, mlflow, caddy, drift, retrain]
    steps:
      - uses: actions/checkout@v4
      - name: Build or pull amd64 image and scan full dependency inventory
        env:
          RELEASE_IMAGE: ${{ matrix.image }}
        run: bash deploy/scan-release-image.sh "$RELEASE_IMAGE" "$RUNNER_TEMP/release-inventory"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-image-${{ matrix.image }}
          path: ${{ runner.temp }}/release-inventory
