name: Kafka security candidate
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/kafka-upgrade-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql://fraud:test-only@127.0.0.1:25432/fraud
      TEST_REDIS: 127.0.0.1:26379
      TEST_KAFKA_BOOTSTRAP: 127.0.0.1:29092
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Inventory candidate by digest
        run: |
          bash deploy/scan-release-image.sh kafka-next "$RUNNER_TEMP/kafka-next"
          jq -e 'any(.Results[]; .Type == "jar" and (.Packages | length > 0)) and
            all(.Results[] | (.Vulnerabilities // [])[]; .VulnerabilityID != "CVE-2026-75595")' \
            "$RUNNER_TEMP/kafka-next/trivy.json"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Start candidate with Apache's JVM mitigation
        run: |
          read -r _ candidate < "$RUNNER_TEMP/kafka-next/release-reference.txt"
          cat > "$RUNNER_TEMP/kafka-next.yml" <<EOF
          services:
            kafka:
              image: $candidate
              environment:
                KAFKA_OPTS: "-XX:-UseBASE64Intrinsics"
          EOF
          docker compose -p kafka-candidate -f docker-compose.test.yml -f "$RUNNER_TEMP/kafka-next.yml" up -d --wait
      - name: Kafka and PostgreSQL/Feast regression checks
        run: python -m pytest tests/test_integration.py -k 'kafka or feast or unreachable_dlq' -rfEs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kafka-security-candidate
          path: ${{ runner.temp }}/kafka-next
