# Drift job (src/monitoring/run_drift.py --no-retrain) every 6 hours (UTC): feature drift,
# prediction drift and delayed-label PR-AUC over the in-cluster scored_transactions; one row in
# drift_reports per run. Drift checks only: retraining needs the MLflow registry, a local SQLite
# file on the host (docs/kubernetes.md). Run once by hand:
#   kubectl -n fraud-k8s create job drift-manual --from=cronjob/drift
# The Evidently HTML goes to the PVC drift-reports, which the dashboard mounts read-only
# (k8s/dashboard.yaml). ReadWriteOnce is enough on this single node: every pod that mounts it
# runs on the same node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drift-reports
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          initContainers:
            # Minikube's hostPath volumes ignore fsGroup: hand the reports dir to the image user.
            - name: reports-owner
              image: fraud-monitoring:k8s-local
              imagePullPolicy: IfNotPresent
              securityContext: {runAsUser: 0}
              command: ["sh", "-c", "chown 10001:10001 /reports"]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 100m, memory: 64Mi}
              volumeMounts:
                - {name: reports, mountPath: /reports}
          containers:
            - name: drift
              image: fraud-monitoring:k8s-local
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - src.monitoring.run_drift
                - --no-retrain
                - --raw-dir
                - /data/raw
                - --reports-dir
                - /reports  # PVC drift-reports, shown by the dashboard
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: fraud-postgres, key: password}
                - name: DATABASE_URL
                  value: postgresql://fraud:$(POSTGRES_PASSWORD)@postgres:5432/fraud
                - {name: EVIDENTLY_DISABLE_TELEMETRY, value: "1"}
                - {name: DO_NOT_TRACK, value: "1"}
              resources:
                requests: {cpu: 500m, memory: 1Gi}
                limits: {cpu: "2", memory: 2Gi}
              volumeMounts:
                - {name: raw, mountPath: /data/raw, readOnly: true}
                - {name: reports, mountPath: /reports}
          volumes:
            - name: raw
              hostPath: {path: /data/fraud-raw, type: Directory}
            - name: reports
              persistentVolumeClaim: {claimName: drift-reports}
