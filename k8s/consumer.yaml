# Kafka consumers (src/streaming/consumer.py): one per partition of transactions (3).
# Liveness: the consumer touches CONSUMER_HEARTBEAT_FILE on every poll-loop iteration (also when
# idle, and during retry waits); the probe fails when the file is older than 60 s, i.e. when the
# loop itself has stopped. A restart redelivers the uncommitted message (idempotent writes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  labels: {app: consumer}
spec:
  replicas: 3
  selector:
    matchLabels: {app: consumer}
  template:
    metadata:
      labels: {app: consumer}
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30  # SIGTERM: finish + commit the in-flight message
      initContainers:
        - name: wait-for-dependencies
          image: fraud-serving:k8s-local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
                import socket, sys, time
                targets = [t.split(":") for t in sys.argv[1:]]
                for host, port in targets:
                    for _ in range(120):
                        try:
                            socket.create_connection((host, int(port)), timeout=2).close()
                            print("reachable", host, port, flush=True)
                            break
                        except OSError:
                            time.sleep(2)
                    else:
                        sys.exit(f"{host}:{port} not reachable")
            - postgres:5432
            - kafka:9092
            - redis:6379
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: consumer
          image: fraud-serving:k8s-local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.streaming.consumer"]
          envFrom:
            - configMapRef: {name: fraud-app-config}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: fraud-postgres, key: password}
            - name: DATABASE_URL
              value: postgresql://fraud:$(POSTGRES_PASSWORD)@postgres:5432/fraud
            - {name: CONSUMER_HEARTBEAT_FILE, value: /tmp/heartbeat}
          # Startup: model load + Feast registration before the first heartbeat (up to 3 min).
          # Exec probes get 5 s: the 1 s default timed out once under CPU load on the 4 GB node.
          startupProbe:
            timeoutSeconds: 5
            exec:
              command: ["test", "-f", "/tmp/heartbeat"]
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            timeoutSeconds: 5
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 60
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
