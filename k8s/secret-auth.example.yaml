# Example only: placeholder values, never real ones, and NOT in kustomization.yaml.
# Create the real Secret at deploy time instead (docs/kubernetes.md), for example:
#   kubectl -n fraud-k8s create secret generic fraud-auth \
#     --from-literal=api-key="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" \
#     --from-literal=dashboard-users="$(python -m src.dashboard.auth hash alice)"
# The API refuses an api-key containing "change-me"; the dashboard refuses a non-bcrypt entry.
apiVersion: v1
kind: Secret
metadata:
  name: fraud-auth
  namespace: fraud-k8s
type: Opaque
stringData:
  api-key: change-me-to-a-random-key
  dashboard-users: "name:paste-the-bcrypt-hash-here"
