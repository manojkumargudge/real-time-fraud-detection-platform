# Settings shared by the API and the consumers (src/serving/config.py). FEATURE_SOURCE=store:
# history features from PostgreSQL, no Feast state in this smoke test (the full deployment needs
# a Feast materialize Job and FEATURE_SOURCE=feast, FEAST_REDIS=redis:6379).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-app-config
data:
  MODEL_DIR: /app/artifacts/baseline
  FEATURE_SOURCE: store
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: transactions
  KAFKA_GROUP_ID: fraud-scorer
  KAFKA_DLQ_TOPIC: transactions.dlq
