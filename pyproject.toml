[project]
name = "fraud-platform"
version = "0.1.0"
description = "Real-time financial fraud detection platform (AIML-01)"
requires-python = ">=3.11,<3.12"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PD"]
ignore = ["PD901"]

[tool.mypy]
# Run: python -m mypy   (checks `files`; listed with the other checks in README "Setup")
python_version = "3.11"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# confluent-kafka ships no type information (no py.typed, no stub package on PyPI).
module = ["confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyarrow ships no type information (no py.typed); used only to write Feast's parquet sources.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "real_data: requires the IEEE-CIS dataset under data/raw/ieee-cis (skipped if absent)",
    "integration: needs live services (TEST_DATABASE_URL / TEST_KAFKA_BOOTSTRAP); skipped if unset",
]
